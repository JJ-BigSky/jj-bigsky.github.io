<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
.og{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.4px, transparent 1.7px);background-size:24px 24px}
.og::before,.og::after{content:"";position:absolute;width:22px;height:22px;border:0 solid var(--ink);opacity:.6}
.og::before{top:28px;left:28px;border-width:2px 0 0 2px}.og::after{bottom:28px;right:28px;border-width:0 2px 2px 0}
.brand{display:flex;align-items:center;gap:16px;font:800 20px var(--font-head);font-stretch:112%;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.brand b{color:var(--accent)}
.eye{margin:64px 0 22px;display:flex;align-items:center;gap:16px;font:600 20px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eye::before{content:"";width:56px;height:2px;background:var(--accent)}
h1{font:800 74px/1 var(--font-head);font-stretch:108%;letter-spacing:-.02em;margin:0;max-width:1000px;color:var(--ink)}
.sub{margin:26px 0 0;font:italic 400 32px/1.25 var(--font-serif);color:var(--muted);max-width:920px}
.foot{position:absolute;left:72px;bottom:56px;display:flex;gap:28px;font:600 18px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.foot i{display:inline-block;width:12px;height:12px;background:var(--accent);margin-right:12px;vertical-align:-1px}
.sq{position:absolute;right:72px;top:64px;width:28px;height:28px;background:var(--accent)}
</style></head><body><div class="og">
<div class="brand"><svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true"><rect x="1" y="1" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width=".8" stroke-dasharray="1.5 4"/><path d="M6 31 L15 16 L21 24 L26 19 L34 31" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="26" y="7" width="6" height="6" fill="#FF4A00"/></svg><span>Big Sky <b>Systems</b></span></div>
<div class="sq"></div>
<p class="eye">__EYE__</p>
<h1>__H1__</h1>
<p class="sub">__SUB__</p>
<div class="foot"><span><i></i>Robotics lab consulting</span><span>Boring is the goal. Boring means it works.</span></div>
</div></body></html>
